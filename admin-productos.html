<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - El Enemigos</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(100, 100, 255, 0.3);
        }

        .admin-header h1 {
            color: #9370DB;
            font-size: 32px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info span {
            color: rgba(255, 255, 255, 0.8);
        }

        .btn-logout {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }

        .btn-return {
            background: linear-gradient(135deg, #56ccf2 0%, #2f80ed 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-return:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(47, 128, 237, 0.3);
        }

        .admin-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        @media (max-width: 768px) {
            .admin-content {
                grid-template-columns: 1fr;
            }
        }

        .form-section {
            background: rgba(147, 112, 219, 0.1);
            border: 2px solid rgba(147, 112, 219, 0.3);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .form-section h2 {
            color: #9370DB;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(147, 112, 219, 0.5);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #9370DB;
            box-shadow: 0 0 10px rgba(147, 112, 219, 0.5);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .form-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .form-group button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: rgba(76, 175, 80, 0.3);
            color: #4caf50;
            border: 1px solid rgba(76, 175, 80, 0.5);
            display: block;
        }

        .message.error {
            background: rgba(244, 67, 54, 0.3);
            color: #f44336;
            border: 1px solid rgba(244, 67, 54, 0.5);
            display: block;
        }

        .productos-list {
            background: rgba(147, 112, 219, 0.1);
            border: 2px solid rgba(147, 112, 219, 0.3);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .productos-list h2 {
            color: #9370DB;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .producto-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-left: 4px solid #9370DB;
        }

        .producto-item img.product-image {
            max-width: 120px;
            max-height: 120px;
            border-radius: 8px;
            margin-right: 15px;
            object-fit: cover;
        }

        .producto-item-info h3 {
            color: #9370DB;
            margin-bottom: 5px;
        }

        .producto-item-info p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            margin: 3px 0;
        }

        .producto-item-actions {
            display: flex;
            gap: 10px;
        }

        .btn-delete {
            background: #f44336;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .btn-delete:hover {
            background: #d32f2f;
            transform: translateY(-2px);
        }

        .btn-edit {
            background: #4caf50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .btn-edit:hover {
            background: #43a047;
            transform: translateY(-2px);
        }

        .btn-cancel {
            background: #9e9e9e;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .btn-cancel:hover {
            background: #757575;
            transform: translateY(-2px);
        }

        .no-products {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🎮 Panel de Administración</h1>
            <div class="user-info">
                <span id="userDisplay">Usuario</span>
                <a class="btn-return" href="productos.html"><i class="fas fa-arrow-left"></i>Ver Productos</a>
                <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
            </div>
        </div>

        <div class="admin-content">
            <!-- Formulario para crear productos -->
            <div class="form-section">
                <h2>Crear Nuevo Producto</h2>
                <div id="productMessage" class="message"></div>

                <form id="productForm">
                    <div class="form-group">
                        <label for="productName">Nombre del Producto:</label>
                        <input type="text" id="productName" required placeholder="Ej: PlayStation 5">
                    </div>

                    <div class="form-group">
                        <label for="productCategory">Categoría:</label>
                        <select id="productCategory" required>
                            <option value="">Selecciona una categoría</option>
                            <option value="juegos">Juegos</option>
                            <option value="consolas">Consolas</option>
                            <option value="accesorios">Accesorios</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="productPrice">Precio (COP):</label>
                        <input type="number" id="productPrice" step="0.01" required placeholder="99999.99">
                    </div>

                    <div class="form-group">
                        <label for="productStock">Stock:</label>
                        <input type="number" id="productStock" value="100" required placeholder="100">
                    </div>

                    <div class="form-group">
                        <label for="productImage">Imagen del Producto:</label>
                        <input type="file" id="productImage" accept="image/png, image/jpeg">
                        <small>Sube un archivo PNG o JPG. Si editas, deja en blanco para mantener la imagen actual.</small>
                    </div>

                    <div class="form-group">
                        <label for="productDescription">Descripción:</label>
                        <textarea id="productDescription" required placeholder="Describe el producto..."></textarea>
                    </div>

                    <input type="hidden" id="productId">

                    <div class="form-group">
                        <button type="submit" id="submitProductButton">Crear Producto</button>
                    </div>
                    <div class="form-group">
                        <button type="button" id="cancelEditButton" class="btn-cancel" style="display: none;">Cancelar edición</button>
                    </div>
                </form>
            </div>

            <!-- Lista de productos -->
            <div class="productos-list">
                <h2>Productos Registrados</h2>
                <div id="productosList">
                    <div class="no-products">
                        <p>Cargando productos...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/admin-products.js"></script>
</body>
</html>
